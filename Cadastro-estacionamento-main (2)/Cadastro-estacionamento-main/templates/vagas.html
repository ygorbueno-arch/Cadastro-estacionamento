{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-grid-3x3-gap"></i> Gerenciar Vagas</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalVaga">
        <i class="bi bi-plus-circle"></i> Nova Vaga
    </button>
</div>

<div class="row">
    {% for vaga in vagas %}
    <div class="col-md-2 mb-3">
        <div class="card text-center {% if vaga.status == 'livre' %}vaga-livre{% else %}vaga-ocupada{% endif %}">
            <div class="card-body">
                <h3>{{ vaga.numero }}</h3>
                <p class="mb-1">
                    <span class="badge {% if vaga.status == 'livre' %}bg-success{% else %}bg-danger{% endif %}">
                        {{ vaga.status }}
                    </span>
                </p>
                <small>{{ vaga.tipo }}</small>
                <div class="mt-2">
                    <a href="/vagas/status/{{ vaga.id }}/livre" class="btn btn-sm btn-success">✓</a>
                    <a href="/vagas/status/{{ vaga.id }}/ocupada" class="btn btn-sm btn-warning">!</a>
                    <a href="/vagas/status/{{ vaga.id }}/manutencao" class="btn btn-sm btn-secondary">🔧</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Modal Nova Vaga -->
<div class="modal fade" id="modalVaga">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <form action="/vagas/adicionar" method="POST">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Vaga</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Número *</label>
                        <input type="number" class="form-control" name="numero" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-control" name="tipo">
                            <option value="normal">Normal</option>
                            <option value="preferencial">Preferencial</option>
                            <option value="idoso">Idoso</option>
                            <option value="pcd">PCD</option>
                            <option value="gestante">Gestante</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
