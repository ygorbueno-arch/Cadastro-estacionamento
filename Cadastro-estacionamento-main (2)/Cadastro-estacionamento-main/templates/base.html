<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Estacionamento{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background-color: #f5f5f5; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border: none; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .stats-card { border-left: 4px solid; }
        .vaga-livre { background-color: #d4edda; }
        .vaga-ocupada { background-color: #f8d7da; }
    
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-p-square-fill"></i> Estacionamento
            </a>
            <div class="navbar-nav">
                <div class="d-flex">
                    <a class="nav-link text-white" href="/"><i class="bi bi-house"></i> Home</a>
                    <a class="nav-link text-white" href="/clientes"><i class="bi bi-people"></i> Clientes</a>
                    <a class="nav-link text-white" href="/veiculos"><i class="bi bi-car-front"></i> Veículos</a>
                    <a class="nav-link text-white" href="/vagas"><i class="bi bi-grid-3x3-gap"></i> Vagas</a>
                    <a class="nav-link text-white" href="/relatorios"><i class="bi bi-graph-up"></i> Relatórios</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
